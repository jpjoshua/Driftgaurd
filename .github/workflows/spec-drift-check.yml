name: Spec drift check

# Runs weekly, plus on demand, plus whenever the linter or version file
# changes. Detects if OKF's live SPEC.md has moved to a new version since
# spec_version_tested.txt was last updated; if so, pulls the current
# reference bundles and re-runs check-compliance against them, then opens
# an issue with the result so drift never sits unnoticed.

on:
  schedule:
    - cron: '0 13 * * 1'  # every Monday, 13:00 UTC
  workflow_dispatch: {}
  push:
    paths:
      - 'plugins/driftguard/scripts/okf_lint.py'
      - 'spec_version_tested.txt'

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Check out driftguard
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Check spec version
        id: version_check
        run: |
          set +e
          output=$(python3 plugins/driftguard/scripts/check_spec_version.py)
          code=$?
          echo "$output"
          echo "output<<EOF" >> "$GITHUB_OUTPUT"
          echo "$output" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Pull fresh reference bundles (only if drift detected)
        if: steps.version_check.outputs.exit_code == '1'
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/GoogleCloudPlatform/knowledge-catalog.git /tmp/okf-live
          cd /tmp/okf-live
          git sparse-checkout set okf

      - name: Re-run check-compliance against live bundles (only if drift detected)
        if: steps.version_check.outputs.exit_code == '1'
        id: rerun
        run: |
          set +e
          output=$(python3 plugins/driftguard/scripts/okf_lint.py /tmp/okf-live/okf/bundles/*)
          echo "$output"
          echo "output<<EOF" >> "$GITHUB_OUTPUT"
          echo "$output" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open an issue reporting the drift (only if drift detected)
        if: steps.version_check.outputs.exit_code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const versionOutput = `${{ steps.version_check.outputs.output }}`;
            const rerunOutput = `${{ steps.rerun.outputs.output }}`;
            const body = [
              '## OKF spec version drift detected',
              '',
              'Automated weekly check found the live spec has moved:',
              '',
              '```',
              versionOutput,
              '```',
              '',
              '### check-compliance re-run against the current live reference bundles',
              '',
              '```',
              rerunOutput,
              '```',
              '',
              'Next steps:',
              '- [ ] Diff the live SPEC.md against what `okf_lint.py` currently implements',
              '- [ ] Update `okf_lint.py` if new conformance rules were added or existing ones changed',
              '- [ ] Re-run `/driftguard:generate-report` for a full written report',
              '- [ ] Update `spec_version_tested.txt` once the tool is confirmed to still pass',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Spec version drift detected — re-validation needed`,
              body: body,
              labels: ['spec-drift'],
            });
